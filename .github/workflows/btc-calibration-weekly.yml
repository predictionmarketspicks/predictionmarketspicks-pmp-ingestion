name: Bitcoin Calibration Weekly Refit

# Refits the bitcoin edge calibration map against our own settled record and
# writes a NEW SHADOW row every Monday. The fit never activates anything; the
# Loop v2 decision step below (scripts/auto-promote-calibration.js) may, under
# the written bar — two fits beating raw Brier AND the re-scored picks clearing
# the §2 PROMOTE bar. scripts/promote-btc-calibration.js stays as the
# out-of-sample Brier read, report only.
#
# The engine picks up maps active-first, so a fresh shadow row can never
# displace a promoted active map.
#
# Plan: handoffs/BITCOIN_EDGE_V21_CALIBRATED_RELAUNCH_2026-08-05.md §4.4

on:
  schedule:
    # Mondays 12:00 UTC — after the weekend's picks have settled.
    - cron: '0 12 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fit and print without writing a row'
        type: boolean
        default: false

jobs:
  refit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Fit calibration map
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: node scripts/fit-btc-calibration.js ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Out-of-sample Brier gate (report only — the §4.3 read, kept for the log)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/promote-btc-calibration.js

      # Loop v2 (site repo handoffs/EDGE_LOOP_V2_2026-11-09.md U8): the map auto-promotes when
      # brier_cal < brier_raw on the two newest fits AND the settled picks re-scored under the
      # calibrated probability clear the §2 PROMOTE bar (n ≥ 50, 30d and all-time net > 0, 4 of the
      # last 6 weeks positive, Wilson LB > breakeven, no day > 50 % of net_30d). Prints the decision
      # + every number; on PROMOTE flips active=true and writes the engine_rule_events row
      # (actor calibration-fit). A dry run prints and writes nothing.
      - name: Loop v2 auto-promote decision
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: node scripts/auto-promote-calibration.js --commodity bitcoin --method platt_pooled ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '--promote' }}
