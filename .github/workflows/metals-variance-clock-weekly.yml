name: Metals Variance Clock Weekly Refit

# Refits the gold and silver intraday variance clocks (24 ET-hour weights) from
# metals_spot_marks and writes a NEW SHADOW row per metal to edge_calibration_maps
# (method variance_clock_v1). The fit never activates anything; the Loop v2
# decision step below may, under the written bar (site repo
# handoffs/EDGE_LOOP_V2_2026-11-09.md U8, superseding the manual PART 3 read in
# METALS_EDGE_VARIANCE_CLOCK_2026-10-23.md).
# The engine fails open to calendar time when the newest clock row is > 14 days
# old, so two missed runs in a row turn prob_clock off (null), never wrong.

on:
  schedule:
    # Mondays 12:30 UTC — after the btc refit, with the full prior week of marks.
    - cron: '30 12 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fit and print without writing rows'
        type: boolean
        default: false

jobs:
  refit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        commodity: [gold, silver]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Fit variance clock
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: node scripts/fit-variance-clock.js --commodity ${{ matrix.commodity }} ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      # Loop v2 (site repo handoffs/EDGE_LOOP_V2_2026-11-09.md U8): scores the shadow (Brier of
      # prob_clock vs prob_physical vs the book on settled strikes), stamps it on the newest clock row,
      # and auto-promotes when brier_cal < brier_raw on the two newest fits AND the settled picks
      # re-scored under prob_clock clear the §2 PROMOTE bar AND ≥ 10 trading days of clock data exist.
      # Prints the decision + every number; on PROMOTE flips active=true and writes the
      # engine_rule_events row (actor calibration-fit). A dry run prints and writes nothing.
      - name: Loop v2 auto-promote decision
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: node scripts/auto-promote-calibration.js --commodity ${{ matrix.commodity }} --method variance_clock_v1 ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '--promote' }}
