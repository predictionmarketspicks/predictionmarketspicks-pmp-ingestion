name: WC Sim Nightly

on:
  # TOURNAMENT OVER (2026-07-19). This workflow is DISABLED at the GitHub level
  # (`gh workflow disable wc-sim-nightly.yml`, 2026-07-27) — re-enable only if
  # there is a live tournament to simulate.
  #
  # History: a group-stage-only hourly cron ('0 * * * *') was added for the result
  # autofeed and marked "REVERT after the group stage". It was never reverted, so it
  # kept re-simulating a FINISHED tournament ~13×/day (GitHub throttles the hourly
  # schedule), writing 648 rows/run into world_cup_simulation until 2026-07-27 —
  # 125 MB of dead rows. It is deleted below, not just disabled: disabling alone is
  # undone by anyone clicking "Enable workflow".
  #
  # Before re-enabling for a future tournament, re-read
  # handoffs/STORAGE_CLEANUP_WC_TAIL_2026-07-27.md (PMP repo) — the WC base tables
  # were truncated and the *_latest matviews are frozen. NEVER refresh those matviews
  # against empty base tables; it blanks the live pages.
  schedule:
    - cron: '0 6 * * *'   # 02:00 ET — nightly baseline (off-tournament cadence)
  workflow_dispatch:
    inputs:
      validate_only:
        description: 'Run validation only, no DB writes'
        type: boolean
        default: false
      iterations:
        description: 'Monte Carlo iterations (override default 10000)'
        type: string
        default: '10000'
  # Event-driven path (handoffs/WC_RESULT_AUTOFEED_2026-06-18.md): the Fly engine
  # CAN fire this on a newly-settled FT result for near-real-time re-runs. It is
  # DORMANT by choice — no GH_DISPATCH_TOKEN is set on the engine, so the
  # dispatch no-ops and the hourly cron above is the active Lag-B collapse. Set
  # the Fly secret later to upgrade to event-driven with zero code changes.
  repository_dispatch:
    types: [wc-result-settled]

# Collapse rapid-fire settlements (multiple matches finishing close together)
# into a queue instead of stacking parallel sims. Let an in-flight sim finish.
concurrency:
  group: wc-sim
  cancel-in-progress: false

jobs:
  run-sim:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/wc/requirements.txt

      - name: Install deps
        run: pip install -r scripts/wc/requirements.txt

      - name: Run sim
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DISCORD_BOT_TOKEN:    ${{ secrets.DISCORD_BOT_TOKEN }}
          WC_SIM_ITERATIONS:    ${{ github.event.inputs.iterations || '10000' }}
          # v5 conditions the group MC on completed results. CI only checks out the
          # engine repo, so results come from the site's public route (default in
          # wc/results.py; override here if the domain changes).
          WC_MATCHES_URL:       https://predictionmarketspicks.com/api/wc/matches
          # During the tournament, refuse to publish a stale full re-sim if results
          # can't be loaded (loud fail → Discord). Remove after the group stage.
          WC_SIM_REQUIRE_RESULTS: '1'
        run: |
          if [ "${{ github.event.inputs.validate_only }}" = "true" ]; then
            python scripts/run-wc-sim.py --validate-only
          else
            python scripts/run-wc-sim.py
          fi
