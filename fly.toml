app = "pmp-ingestion"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 100

  # Routing health-check keys on /alive (process-up), NOT /health. /health 503s
  # when a required feed is stale (e.g. the flaky Yahoo oil feed off-hours), and
  # gating Fly routing on that took the whole HTTP service offline externally even
  # though the process was fine. Feed staleness is still surfaced via /health for
  # monitoring/alerts — it just no longer deregisters the machine.
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/alive"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
