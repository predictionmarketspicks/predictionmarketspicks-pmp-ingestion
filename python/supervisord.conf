; supervisord runs Node + Python sidecar in one Fly machine. Both processes
; restart on crash; the container exits if either is unrecoverable. The
; canonical /health endpoint stays on the Node engine (port 8080), which
; surfaces sidecar health by polling http://127.0.0.1:9090/health.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=info

[program:node-engine]
command=node src/index.js
directory=/app
autostart=true
autorestart=true
startretries=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=NODE_ENV="production"

[program:databento-sidecar]
command=python3 python/databento_live.py
directory=/app
autostart=true
autorestart=true
startretries=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
