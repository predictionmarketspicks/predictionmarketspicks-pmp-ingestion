; supervisord runs Node + Python sidecar in one Fly machine.
;
; Real behaviour (made true 2026-11-03, ENGINE_OUTAGE_ALARMS_AND_OPEN_FIXES P0-D):
; - A crash after a program has been up startsecs (10 s) restarts it, forever.
; - A program that fails to START startretries (20) times in a row goes FATAL.
; - On FATAL, [eventlistener:fatal-exit] SIGKILLs supervisord; the machine exits
;   non-zero and Fly's restart policy (on-failure, max 10) boots a fresh one.
;   Before this, FATAL was silent: Node kept /alive green and the Databento
;   sidecar stayed dead for 49 h (Nov 1–3 2026).
; The canonical /health endpoint stays on the Node engine (port 8080), which
; surfaces sidecar health by polling http://127.0.0.1:9090/health.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=info

[program:node-engine]
command=node src/index.js
directory=/app
autostart=true
autorestart=true
startsecs=10
startretries=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=NODE_ENV="production"

[program:databento-sidecar]
command=python3 python/databento_live.py
directory=/app
autostart=true
autorestart=true
startsecs=10
startretries=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[eventlistener:fatal-exit]
command=python3 python/fatal_listener.py
directory=/app
events=PROCESS_STATE_FATAL
autostart=true
autorestart=true
stdout_logfile=NONE
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
